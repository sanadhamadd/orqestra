# Version updates only: one grouped PR per ecosystem, once a month.
# The CI service image in .github/workflows/ci.yml is not read by Dependabot; when it
# updates compose.yaml, copy the new digest into ci.yml in the same PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      uv:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      docker-compose:
        patterns: ["*"]
