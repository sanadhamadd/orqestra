# PostgreSQL for local development and integration tests only. Never use this file,
# its credentials or its volume for production or shared environments.
name: orqestra

services:
  postgres:
    # The same postgres:16.15 multi-arch index digest that CI's verify job pins.
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_DB: orqestra_local
      POSTGRES_USER: orqestra_local
      # No password, as in CI: the server trusts every connection, so the port must stay
      # bound to the loopback address. Some integration tests reconnect from a live
      # connection's DSN, which libpq returns without its password.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # Host port 5433, so a PostgreSQL server already running on 5432 is not in the way.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orqestra_local", "-d", "orqestra_local"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
