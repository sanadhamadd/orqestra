[project]
name = "orqestra"
version = "0.1.0.dev0"
description = "General-purpose engine for large-scale data analytics and AI tasks on PostgreSQL, with crash recovery and cost tracking."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["postgresql", "task queue", "distributed workers", "data analytics", "AI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
]

[project.urls]
Repository = "https://github.com/sanadhamadd/orqestra"
Documentation = "https://github.com/sanadhamadd/orqestra/tree/main/docs"

[project.scripts]
orqestra = "orqestra.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orqestra"]
exclude = ["**/.env*", "**/*.log"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "pyproject.toml"]
exclude = ["**/.env*", "**/*.log"]

[tool.uv]
# The build backend and its dependencies, exact. uv sync and uv lock apply this; uv build does
# not, so make package-check passes the same list with --build-constraint.
build-constraint-dependencies = [
    "editables==0.6",
    "hatchling==1.33.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "ANN",      # type annotations
    "N",        # naming
]
ignore = ["ANN401"]  # explicit Any is sometimes the honest type at boundaries

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "benchmarks", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast, isolated tests (default PR lane)",
    "integration: tests needing PostgreSQL or other services",
    "e2e: full submit -> process -> aggregate workflows",
    "performance: load and benchmark tests (never in the PR lane)",
]

[tool.coverage.run]
source = ["orqestra"]
branch = true

[tool.coverage.report]
show_missing = true
# The 80% threshold is enforced on the combined unit + integration run
# (`make verify`); the unit-only lane reports coverage without enforcing it.
